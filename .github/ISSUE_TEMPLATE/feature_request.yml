name: Feature request
description: A new feature, improvement, or workflow change
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: |
        Lead with the user-facing reason, not the implementation. "When I X, I want to be able to Y, because Z."
        Skip this if it's pure tech-debt or refactor.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd want it to work. Mock-ups, sketches, references to other apps welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out, and why. Helps avoid retreading the same ground.

  - type: dropdown
    id: phase
    attributes:
      label: Roadmap fit
      description: See CLAUDE.md for phase definitions. Don't worry if you're not sure — leave blank.
      options:
        - Phase 1 (Shearwater BLE + dive analysis)
        - Phase 2 (cloud sync + multi-device)
        - Phase 3 (attachments, certifications, media)
        - Phase 4 (libdivecomputer, other DCs)
        - Unsure / no opinion
