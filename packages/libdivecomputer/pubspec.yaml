name: libdivecomputer
description: >-
  Vendored libdivecomputer at a pinned upstream commit, built by a native
  assets hook, with the Dart bindings the Anchorline app uses to talk to
  dive computers from other manufacturers.
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^1.0.3
  native_toolchain_c: ^0.17.6
  subsurface_core:
    path: ../subsurface_core

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.26.0
