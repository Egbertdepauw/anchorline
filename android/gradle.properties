org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# No effect on AGP 8.x. AGP 9 defaults both flags to true, and on Flutter 3.44
# they must then stay false (#82). Don't delete the lines: Flutter's migrator
# re-adds `=false` on the next build if they're missing.
android.builtInKotlin=false
android.newDsl=false
