name: ccrlogger
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+47

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.0
  intl: ^0.19.0
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  geolocator: ^14.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  shared_preferences: ^2.3.0
  xml: ^6.5.0
  share_plus: ^10.0.0
  supabase_flutter: ^2.8.0
  powersync: ^2.1.0
  # Keeps the iPhone screen awake during BLE import. iOS suspends BLE
  # callbacks when the screen locks; the Petrel hits its log-mode
  # session timeout (~60s) right after we go silent, even though the
  # user is staring at the import progress screen.
  wakelock_plus: ^1.2.8

  # Phase 3 attachments — file picking, camera capture, MIME lookup,
  # opening external URLs, and the http client that talks to the
  # signing Worker + R2 presigned URLs.
  http: ^1.2.0
  file_picker: ^11.0.3
  image_picker: ^1.1.0
  url_launcher: ^6.3.0
  mime: ^1.0.5
  # Native PDF rendering (PDFKit on iOS/macOS, PdfRenderer on Android,
  # MuPDF on desktop). Used by the in-app PDF viewer so attached PDFs
  # open inline instead of dropping the user into a share sheet.
  pdfx: ^2.6.0
  git2dart: ^0.5.4
  # 1.12.1 fixes the Windows OpenSSL bundling (DartGit-dev/
  # git2dart_binaries#20) — ships libcrypto-3/libssl-3 DLLs with a
  # correct bundled-libraries manifest — and ships a self-contained
  # macOS libgit2.dylib (libssh2/OpenSSL statically linked), which
  # obsoleted our vendored-libcrypto build phase (see #74).
  git2dart_binaries: ^1.12.1
  flutter_secure_storage: ^10.1.0
  # malloc/calloc and UTF-8/16 strings for the desktop gas-analyzer serial
  # port (lib/analyzer/transport/native_serial_port.dart). Pure Dart, no
  # native build; already in the lock as a transitive dependency.
  ffi: 2.2.0

  # Crash + unhandled-exception reporting for release / beta builds.
  # Gated by kReleaseMode AND --dart-define=SENTRY_DSN=... at build time
  # (see main.dart) so debug builds never init the SDK or report.
  sentry_flutter: ^9.0.0

  # Renders the Anchorline brand marks (assets/brand/*.svg) — refined
  # SVGs have multi-colour fills baked into the paths, so we render
  # them as-is without applying a colorFilter.
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14
  sqlite3: ^3.3.1
  flutter_launcher_icons: ^0.14.4
  sentry_dart_plugin: ^3.4.0

flutter_launcher_icons:
  image_path: "assets/brand/launcher-1024.png"
  # iOS gets a separate source with the corners pre-filled with
  # hullBlack (no alpha at all). flutter_launcher_icons's
  # remove_alpha_ios mats transparent pixels against pure white,
  # which would otherwise give us white corners on the iOS icon.
  image_path_ios: "assets/brand/launcher-1024-ios.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0A1419"
  adaptive_icon_foreground: "assets/brand/adaptive-foreground-1024.png"
  macos:
    generate: true
    image_path: "assets/brand/launcher-1024.png"
  windows:
    generate: true
    image_path: "assets/brand/launcher-1024.png"
  web:
    generate: true
    image_path: "assets/brand/launcher-1024.png"
    background_color: "#0A1419"
    theme_color: "#0A1419"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - test/fixtures/dives/
    - assets/images/watermark.png
    - assets/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-VariableFont.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-VariableFont.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Sentry debug-symbol upload (sentry_dart_plugin). After a release archive:
#   ./macos/scripts/upload_sentry_dsyms.sh
# That wrapper sources the (gitignored) SENTRY_AUTH_TOKEN from
# macos/scripts/sentry.env.local and runs `dart run sentry_dart_plugin`, so
# future macOS Sentry hangs/crashes (#4) arrive with symbolicated native
# frames instead of <redacted>. The org / project slugs below aren't secret
# (the bundle id already carries the org); only the auth token stays out of
# the repo. Any of them can be overridden by the SENTRY_ORG / SENTRY_PROJECT /
# SENTRY_AUTH_TOKEN env vars at upload time.
sentry:
  upload_debug_symbols: true
  upload_sources: false
  upload_source_maps: false
  org: de-spaankamer-bv
  project: ccrlogger
